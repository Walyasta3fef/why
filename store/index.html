<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Nile Games - ألعاب كمبيوتر مجانية</title>
<meta name="description" content="ألعاب كمبيوتر كرتونية مجانية: Corner Market محاكي سوبر ماركت ودليفري، وعالم الفيوم لعبة عالم مفتوح عربية.">
<link rel="canonical" href="https://walyasta3fef.github.io/why/store/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2a2118;--bg:#fbf3e2;--card:#fffaf0;--sun:#ffb72b;--green:#2f8f4e}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Cairo",Tahoma,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.7}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px}
  header{text-align:center;padding:50px 0 20px}
  header h1{margin:0;font-size:48px;font-weight:900;direction:ltr;text-shadow:3px 3px 0 #fff,6px 6px 0 var(--ink)}
  header p{margin:6px 0 0;font-size:19px;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px;padding:30px 0 60px}
  .card{display:flex;flex-direction:column;background:var(--card);border:5px solid var(--ink);border-radius:22px;overflow:hidden;
        box-shadow:8px 8px 0 var(--ink);text-decoration:none;color:inherit;transition:transform .15s}
  .card:hover{transform:translate(-3px,-3px)}
  .card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-bottom:4px solid var(--ink)}
  .card .t{padding:18px 22px 22px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card h2{margin:0;font-size:28px;font-weight:900}
  .card p{margin:0;flex:1}
  .free{align-self:flex-start;background:var(--sun);border:3px solid var(--ink);border-radius:30px;padding:0 14px;font-weight:900;font-size:14px}
  .go{align-self:flex-start;margin-top:10px;background:var(--green);color:#fff;border:3px solid var(--ink);border-radius:14px;
      padding:8px 20px;font-weight:900;box-shadow:4px 4px 0 var(--ink)}
  footer{background:var(--ink);color:var(--bg);text-align:center;padding:22px 0;font-weight:700}
</style>
</head>
<body>
<header class="wrap">
  <h1>Pixel Nile Games</h1>
  <p>ألعاب كمبيوتر كرتونية مجانية</p>
</header>
<main class="wrap grid">
  <a class="card" href="../corner-market/">
    <img src="../corner-market/images/cm_checkout.jpg" alt="Corner Market">
    <div class="t">
      <span class="free">مجانية</span>
      <h2 dir="ltr" style="text-align:right"><img src="../corner-market/images/cm_icon.png" alt="" style="width:34px;vertical-align:middle;border:3px solid var(--ink);border-radius:9px;background:#fff"> Corner Market</h2>
      <p>محاكي سوبر ماركت ودليفري: رفوف وثلاجات وزبائن وكاشير وتوصيل بالسكوتر.</p>
      <span class="go">افتح صفحة اللعبة ←</span>
    </div>
  </a>
  <a class="card" href="../alam-alfayoum/">
    <img src="../alam-alfayoum/images/canal.jpg" alt="عالم الفيوم">
    <div class="t">
      <span class="free">مجانية</span>
      <h2><img src="../alam-alfayoum/images/icon.png" alt="" style="width:40px;vertical-align:middle"> عالم الفيوم</h2>
      <p>لعبة عالم مفتوح عربية بروح الفيوم: سيارات وعمل وبيت وأسرة ومطاردات شرطة.</p>
      <span class="go">افتح صفحة اللعبة ←</span>
    </div>
  </a>
</main>
<footer>Pixel Nile Games © 2026</footer>
</body>
</html>
